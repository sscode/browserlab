name: BrowserLab checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm pack --dry-run
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx agent-browser install --with-deps
      - name: Allow the downloaded Chrome to use its sandbox
        run: |
          cat <<EOF | sudo tee /etc/apparmor.d/browserlab-ci-chrome
          abi <abi/4.0>,
          include <tunables/global>
          profile browserlab-ci-chrome "$HOME/.agent-browser/browsers/**/chrome" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/browserlab-ci-chrome
      - run: npm run install:lightpanda
      - run: node dist/cli.js doctor
      - run: node dist/cli.js demo --repetitions 3 --out .browserlab/ci-reference
      - run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browserlab-engine-results
          path: .browserlab/
          include-hidden-files: true
          retention-days: 7
